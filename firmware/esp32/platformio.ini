; Weasley Clock display node: one ESP32 + one GC9A01 round display per person.
;
;   pio run                  build
;   pio run -t upload        flash over USB
;   pio run -t uploadfs      upload data/ to LittleFS (config.json and loop.wcl)
;   pio device monitor       serial log
;
; Six identical boards. The only thing that differs between them is
; data/config.json, which names the person. Nothing is compiled in.
;
; Board: Aideepen 30-pin ESP32 dev board with a CP2102, per docs/hardware-plan.html.
; "esp32dev" is the right PlatformIO target for that; if yours enumerates oddly,
; check the USB-serial chip's driver before changing anything here.

[env:display-node]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.filesystem = littlefs
; default.csv on 4 MB flash, as measured from a real build:
;   app0      0x140000  1 310 720 B   (this build uses about 1.0 MB of it)
;   app1      0x140000  1 310 720 B   OTA slot
;   littlefs  0x160000  1 441 792 B   config.json + the frame loop
; tools/make_loop.py budgets 1.3 MB against that last figure, leaving margin
; for config.json and LittleFS block overhead.
board_build.partitions = default.csv

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    bitbank2/JPEGDEC@^1.6.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DNODE_FIRMWARE_VERSION=\"0.1.0\"
