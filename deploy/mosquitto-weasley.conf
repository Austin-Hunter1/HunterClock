# Mosquitto settings for the Weasley Clock.
#
# Installed to /etc/mosquitto/conf.d/weasley.conf by deploy/mosquitto-setup.sh.
# Files in conf.d are read after /etc/mosquitto/mosquitto.conf, so this adds to
# the distribution's defaults rather than replacing them.
#
# WHY THIS FILE HAS TO EXIST
#
# Mosquitto 2.x with no listener configured binds loopback only and refuses
# anonymous clients. That is a sensible default and it is also why a freshly
# installed broker looks like it is "running" while nothing can reach it. The
# controller talks to it over localhost and works fine; the six ESP32 display
# nodes are on the house WiFi and cannot connect at all until this exists.

# ---------------------------------------------------------------- listener

# All interfaces, not a fixed address.
#
# The nodes are on the house LAN and the Pi's address there comes from DHCP,
# so binding a specific IP would mean the broker failing to start on the day
# the lease changes -- and a broker that will not start takes the whole clock
# with it. The tailnet is covered by the same listener.
#
# The protection here is credentials and ACLs, not the bind address: every
# client must authenticate and each role can touch only the topics its job
# needs. See mosquitto-weasley.acl.
listener 1883

allow_anonymous false
password_file /etc/mosquitto/weasley.passwd

# acl_file is appended by deploy/mosquitto-setup.sh rather than set here, so
# the path cannot drift between the two files. Every other directive above
# is commented out by that script if this broker already declares it: most
# of Mosquitto's security settings are single-valued, and a second one is a
# fatal duplicate rather than an override.

# Six display nodes, one controller, the odd mosquitto_sub while debugging,
# and room for a few phones later. Far above anything this clock will do, and
# low enough that a loop somewhere cannot exhaust the Pi.
#
# This is a PER-LISTENER option. Mosquitto attaches it to the current
# listener, so meeting it in a file that declares none makes it create the
# default listener -- a second bind on 1883 and "Address already in use" from
# a config containing one listener line. deploy/mosquitto-setup.sh therefore
# comments this out whenever it is inheriting a listener someone else owns.
max_connections 50

# Drop a client that has stopped reading rather than buffering for it for
# ever. A display node that wedges should not grow the broker's memory.
max_queued_messages 200

# Persistence is left to the distribution default on purpose. The controller
# republishes every retained topic every 5 seconds (see Engine.publish_all),
# so retained state refills itself within seconds of a broker restart, and
# nothing here is worth extra writes to the SD card to protect.

# ------------------------------------------------------------------- logs

# `journalctl -u mosquitto` rather than a file that nothing rotates.
log_dest stderr
log_type error
log_type warning
log_type notice
# Connection logging is what tells you a display node is flapping, and it is
# the first thing you want when a bezel has gone dark.
connection_messages true
