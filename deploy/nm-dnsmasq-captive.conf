# Makes the clock's setup page appear by itself when somebody joins the
# fallback hotspot, instead of them having to know to type an IP address.
#
# Installed to /etc/NetworkManager/dnsmasq-shared.d/ by deploy/install.sh.
#
# This is read ONLY by the dnsmasq instance NetworkManager starts for a
# connection with `ipv4.method shared`, which on this Pi is only ever the
# setup access point. It is not the system resolver and does not affect how
# the Pi itself resolves anything, on the hotspot or off it.
#
# Answering every name with the portal's own address is what tips a phone's
# captive-portal detection over: the probe it fires on joining reaches our
# page instead of Apple's or Google's, gets a redirect rather than the
# expected payload, and the "Sign in to network" sheet opens on its own.
address=/#/10.42.0.1

# Hand the phone our address as the DNS server, rather than whatever stale
# server was in the lease it had before.
dhcp-option=option:dns-server,10.42.0.1

# No router option: there is no route off this network, and claiming one
# makes a phone sit waiting for internet that is never coming instead of
# showing the sign-in sheet.
dhcp-option=option:router

# Short leases. The access point is up for minutes, not days, and a phone
# that comes back tomorrow should not be holding a lease from today.
dhcp-range=10.42.0.10,10.42.0.60,60m
