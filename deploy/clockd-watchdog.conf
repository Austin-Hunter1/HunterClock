# Hardware watchdog for the Pi itself.
#
# Installed by deploy/install.sh as a drop-in at
# /etc/systemd/system.conf.d/clockd-watchdog.conf
#
# The Pi 4 has a hardware watchdog at /dev/watchdog. With this, systemd pets it
# every 10 seconds; if the kernel locks up hard enough to stop that, the board
# resets itself. That matters because the clock is in another state and a wedged
# Pi otherwise means a phone call and somebody pulling the plug.
#
# RebootWatchdogSec covers the shutdown path, so a hung reboot also recovers.

[Manager]
RuntimeWatchdogSec=20s
RebootWatchdogSec=2min
