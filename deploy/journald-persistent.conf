# Keep the journal across reboots, capped so it cannot fill the SD card.
#
# Installed by deploy/install.sh at /etc/systemd/journald.conf.d/clockd.conf
#
# Without this, Raspberry Pi OS keeps the journal in RAM and a reboot erases
# exactly the logs that explain why it rebooted.

[Journal]
Storage=persistent
SystemMaxUse=200M
SystemMaxFileSize=20M
MaxRetentionSec=1month
