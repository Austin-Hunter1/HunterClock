name: Build CAD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - build_cad.py
      - requirements-cad.txt
      - .github/workflows/build-cad.yml

jobs:
  cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-cad.txt
      - name: Install CadQuery
        run: pip install -r requirements-cad.txt
      - name: Generate STEP + STL
        run: python build_cad.py
      - uses: actions/upload-artifact@v4
        with:
          name: weasley-clock-cad
          path: cad_out/
