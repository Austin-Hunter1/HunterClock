# Fallback WiFi setup hotspot -- copy to config/hotspot.yaml to change anything.
#
# You almost certainly do not need this file. The defaults below are what the
# clock uses when it is absent, and they are the values we actually want; the
# file exists so the SSID and the timings can be retuned without a code change.
#
# This is deliberately NOT part of config/clock.yaml. The hotspot's whole job
# is to work on a Pi where config/clock.yaml is the thing that is broken, so it
# must not be able to be taken down by a schema error in it. For the same
# reason nothing here is required: an unreadable or invalid file is a warning
# in the journal and these defaults, not a service that refuses to start.
#
# The one thing that is NOT here is the hotspot's own password. It is a secret,
# so it lives in .env as CLOCK_HOTSPOT_PASSWORD. With no password set, the
# clock will not raise an access point at all -- an open network called
# "weasley-clock-setup" would let any passer-by read the house WiFi password
# straight back out of the setup page.
#
#   python -m clockd.hotspot --suggest-password     generate one
#   python -m clockd.hotspot --status               what it would do right now
#   python -m clockd.hotspot --demo                 look at the page, no Pi needed
#
# Write the password on a label inside the cabinet. The person who needs it
# will be standing at the clock with no other way to find it out.

# Turn the whole thing off. Tailscale plus pre-saved networks still works.
enabled: true

# What someone standing at the clock looks for in their phone's WiFi list.
# Boring and self-describing on purpose: it may be the only instruction they
# get if the label has fallen off.
ssid: weasley-clock-setup

# The NetworkManager profile the access point is stored as.
ap_profile: weasley-setup-ap

interface: wlan0

# Where the setup page is served. `ipv4.method shared` puts NetworkManager's
# own dnsmasq on 10.42.0.1 and hands out leases, so a phone needs no setup.
# Port 80 is what makes the captive-portal popup work.
portal_host: 10.42.0.1
portal_port: 80

# How often to look at the network.
check_interval_s: 20

# --- the timings that stop this doing more harm than good -------------------
#
# While the access point is up the clock is OFFLINE: the Pi has one radio and
# cannot be an access point and a WiFi client at the same time. So the hotspot
# is never a destination; it cycles, and every path out of it leads back to
# retrying the saved networks.

# How long the Pi must be off the network before the access point goes up.
# Five minutes rides out a router reboot, a power cut that brings the Pi back
# before the router, and NetworkManager's own retry backoff.
offline_grace_s: 300

# With the access point up and nobody loading the setup page for this long,
# give up and go back to trying the saved networks. THIS is the setting that
# stops a one-off outage turning into a clock that is an access point until
# somebody drives to Minnesota.
hotspot_idle_s: 600

# A ceiling on the access point even when somebody IS using the page, for the
# phone that joined and was then put in a pocket and carried away.
hotspot_max_s: 1800

# How long to let NetworkManager hunt for a saved network after the access
# point comes down, before putting it back up. Needs to cover a scan plus a
# DHCP lease on a slow router.
retry_wifi_s: 180

# Priority given to a network joined through the setup page. Higher than
# anything deploy/add-wifi.sh suggests, because a network somebody typed in
# while standing at the clock is more current than one saved months ago.
join_priority: 100

# How long to wait for a join before calling it failed.
join_timeout_s: 45
