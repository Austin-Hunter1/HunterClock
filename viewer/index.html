<title>Weasley Clock CAD</title>
<style>
/* Layout: full-height 3D stage with a slim toolbar on top; view presets as a button row. */
:root {
  --bg: #F3F0EA;
  --panel: #FFFFFF;
  --fg: #2B2419;
  --muted: #7A6E5C;
  --line: #D9CFBD;
  --accent: #8C5A2B;
  --accent-fg: #FFFFFF;
  --stage: #F3F0EA;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1B1712; --panel: #26211A; --fg: #EFE6D4; --muted: #A89A82;
    --line: #3A3328; --accent: #D9A35F; --accent-fg: #1B1712; --stage: #1B1712;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1B1712; --panel: #26211A; --fg: #EFE6D4; --muted: #A89A82;
  --line: #3A3328; --accent: #D9A35F; --accent-fg: #1B1712; --stage: #1B1712;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); display: flex; flex-direction: column; margin: 0; }
header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .01em; }
.hint { color: var(--muted); font-size: .8rem; flex: 1 1 14rem; min-width: 0; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; font-size: .82rem; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"], button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stage { flex: 1 1 auto; min-height: 0; position: relative; background: var(--stage); }
#stage canvas { display: block; width: 100%; height: 100%; }
#status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-family: var(--font-mono); font-size: .85rem; pointer-events: none; }
#legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .75rem; color: var(--muted); max-width: calc(100% - 24px); }
#legend span::before { content: ""; display: inline-block; width: .6rem; height: .6rem; border-radius: 50%; margin-right: 5px; background: var(--c); }
</style>

<header>
  <h1>Weasley Clock CAD</h1>
  <div class="hint">Drag to rotate, scroll to zoom, right-drag to pan. Case and hand dimensions are placeholders. Motors are the vendor models.</div>
  <div class="bar" id="views">
    <button data-v="front">Full case</button>
    <button data-v="hood">Dial and screens</button>
    <button data-v="drive">Motor stack</button>
    <button data-v="side">Side</button>
    <button id="caseBtn" aria-pressed="false">Hide case</button>
  </div>
</header>
<div id="stage">
  <div id="status">Loading model (12 MB)…</div>
  <div id="legend">
    <span style="--c:#4F7A4A">Becky</span><span style="--c:#3E6470">Elijah</span><span style="--c:#A8672B">Caleb</span>
    <span style="--c:#8A4B6B">Austin</span><span style="--c:#B0562A">Micah</span><span style="--c:#5B5EA6">Evan</span>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const stage = document.getElementById('stage');
const status = document.getElementById('status');
const r = new T.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.prepend(r.domElement);
const scene = new T.Scene();
const cam = new T.PerspectiveCamera(35, 1, 1, 20000);
const ctl = new OrbitControls(cam, r.domElement);
scene.add(new T.HemisphereLight(0xffffff, 0x887766, 1.4));
const sun = new T.DirectionalLight(0xffffff, 1.6);
sun.position.set(300, 600, 900);
scene.add(sun);

function bg() {
  const c = getComputedStyle(document.documentElement).getPropertyValue('--stage').trim();
  scene.background = new T.Color(c || '#F3F0EA');
}
function size() {
  const w = stage.clientWidth || 800, h = stage.clientHeight || 500;
  r.setSize(w, h, false);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
}
new ResizeObserver(size).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', bg);
new MutationObserver(bg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
bg(); size();

// Camera presets: [camera xyz, target xyz], millimetres; +y up, +z toward the viewer
const VIEWS = {
  front: [[0, -300, 2600], [0, -300, 0]],
  hood:  [[450, 150, 800], [0, 100, 0]],
  drive: [[650, 260, -200], [0, 0, -200]],
  side:  [[2200, -300, 100], [0, -300, 0]],
};
function go(k) {
  const [p, t] = VIEWS[k];
  cam.position.set(...p); ctl.target.set(...t); ctl.update();
}
const caseParts = [];
document.getElementById('views').addEventListener('click', e => {
  const k = e.target.dataset.v;
  if (k) go(k);
});
const caseBtn = document.getElementById('caseBtn');
caseBtn.addEventListener('click', () => {
  const hide = caseBtn.getAttribute('aria-pressed') !== 'true';
  caseParts.forEach(m => m.visible = !hide);
  caseBtn.setAttribute('aria-pressed', hide);
  caseBtn.textContent = hide ? 'Show case' : 'Hide case';
});

new GLTFLoader().load('weasley_clock.glb.wasm', g => {
  g.scene.rotation.x = Math.PI / 2;   // file is z-up; the scene is y-up
  g.scene.traverse(m => {
    if (m.name && m.name.startsWith('case_')) caseParts.push(m);
    if (m.isMesh) {
      m.material.side = T.DoubleSide;
      for (let p = m; p; p = p.parent) {
        if (p.name && p.name.startsWith('motor_')) { m.material = m.material.clone(); m.material.color.set('#8C857A'); break; }
      }
    }
  });
  scene.add(g.scene);
  status.remove();
  go('front');
}, undefined, () => { status.textContent = 'Could not load the model file'; });

(function loop() { requestAnimationFrame(loop); r.render(scene, cam); })();
</script>
